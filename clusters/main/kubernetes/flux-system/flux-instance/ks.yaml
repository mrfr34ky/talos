---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
spec:
  dependsOn:
    - name: flux-operator
      namespace: flux-system
  interval: 10m
  path: clusters/main/kubernetes/flux-system/flux-instance/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
    namespace: flux-system
  targetNamespace: flux-system