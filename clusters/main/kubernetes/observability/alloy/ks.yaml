apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  dependsOn:
    - name: loki # ships the logs there
  interval: 10m
  path: clusters/main/kubernetes/observability/alloy/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
