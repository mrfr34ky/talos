---
# Reachable only through traefik-external (the badge Worker comes in that way); can only query
# Prometheus and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kromgo
  namespace: kromgo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kromgo
      app.kubernetes.io/name: kromgo
      pod.name: main
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-external
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus-stack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
