apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-pve-exporter
  namespace: flux-system
spec:
  dependsOn:
    - name: kube-prometheus-stack # chart renders a ServiceMonitor
  interval: 10m
  path: clusters/main/kubernetes/observability/prometheus-pve-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
