---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-pve-exporter-values
  namespace: prometheus-pve-exporter
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  PVE_USER: "${PVE_USER}"
  PVE_TOKEN_NAME: "${PVE_TOKEN_NAME}"
  PVE_TOKEN_VALUE: "${PVE_TOKEN_VALUE}"
