---
# Garage S3 keys for Loki, read as env vars (extraEnvFrom + -config.expand-env), never rendered into the ConfigMap
apiVersion: v1
kind: Secret
metadata:
  name: loki-values
  namespace: loki
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  LOKI_S3_ACCESS_KEY_ID: "${LOKI_S3_ACCESS_KEY_ID}"
  LOKI_S3_SECRET_ACCESS_KEY: "${LOKI_S3_SECRET_ACCESS_KEY}"
