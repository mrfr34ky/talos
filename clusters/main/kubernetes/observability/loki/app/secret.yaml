---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: loki-values
  namespace: loki
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  LOKI_S3_ACCESS_KEY_ID: "${LOKI_S3_ACCESS_KEY_ID}"
  LOKI_S3_SECRET_ACCESS_KEY: "${LOKI_S3_SECRET_ACCESS_KEY}"
