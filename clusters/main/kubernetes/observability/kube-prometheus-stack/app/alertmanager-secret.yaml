---
# Value comes from the cluster-settings SOPS secret via Flux postBuild substitution.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secret
  namespace: kube-prometheus-stack
stringData:
  DISCORD_WEBHOOK_URL: ${ALERTMANAGER_DISCORD_WEBHOOK}
  HEARTBEAT_URL: ${ALERTMANAGER_HEARTBEAT_URL}
