---
# Prometheus exporter for the APC UPS, read from apcupsd (NIS, port 3551) on the Proxmox host,
# for the UPS dashboard in Grafana. sfudeus builds mdlayher/apcupsd_exporter (no upstream image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apcupsd-exporter
  namespace: kube-prometheus-stack
  labels:
    app.kubernetes.io/name: apcupsd-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apcupsd-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apcupsd-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apcupsd-exporter
          image: docker.io/sfudeus/apcupsd_exporter:2025-02-01@sha256:5138b68329b3543101eb8bb3841104304ef4a004b2591175760b1ac8b71e86d0
          args:
            - -apcupsd.addr=192.168.1.48:3551 # same host as ext-prox
            - -telemetry.addr=:9162
          ports:
            - name: metrics
              containerPort: 9162
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 60
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: apcupsd-exporter
  namespace: kube-prometheus-stack
  labels:
    app.kubernetes.io/name: apcupsd-exporter
spec:
  selector:
    app.kubernetes.io/name: apcupsd-exporter
  ports:
    - name: metrics
      port: 9162
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apcupsd-exporter
  namespace: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: apcupsd-exporter
  endpoints:
    - port: metrics
      interval: 30s
---
# Only Prometheus scrapes it; it only talks to apcupsd on the Proxmox host
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apcupsd-exporter
  namespace: kube-prometheus-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apcupsd-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9162
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.1.48/32
      ports:
        - protocol: TCP
          port: 3551
