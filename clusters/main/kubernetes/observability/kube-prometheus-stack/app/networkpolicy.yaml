---
# Prometheus has no login: only traefik-internal (Authentik), Grafana, Kromgo, homarr and its own namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: kube-prometheus-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kube-prometheus-stack
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kromgo
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homarr
      ports:
        - protocol: TCP
          port: 9090
    - from:
        - podSelector: {}
---
# Alertmanager has no login: only traefik-internal (Authentik), Grafana, homarr and its own namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-ingress
  namespace: kube-prometheus-stack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kube-prometheus-stack
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homarr
      ports:
        - protocol: TCP
          port: 9093
    - from:
        - podSelector: {}
