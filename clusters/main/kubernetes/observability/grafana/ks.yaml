apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  dependsOn:
    - name: kube-prometheus-stack # ServiceMonitor CRD; its dashboards and Prometheus data source
  interval: 10m
  path: clusters/main/kubernetes/observability/grafana/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
