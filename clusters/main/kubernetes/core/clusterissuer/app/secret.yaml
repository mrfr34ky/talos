---
# Secret values for the HelmRelease (valuesFrom): the whole clusterIssuer.ACME list, because the
# Cloudflare tokens sit inside it and spec.values would replace a list as a whole.
apiVersion: v1
kind: Secret
metadata:
  name: clusterissuer-values
  namespace: clusterissuer
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  ACME_VALUES: |
    clusterIssuer:
      ACME:
        - name: domain-0-le-staging
          email: "${DOMAIN_0_EMAIL}"
          server: 'https://acme-staging-v02.api.letsencrypt.org/directory'
          type: "cloudflare"
          cfapitoken: '${DOMAIN_0_CLOUDFLARE_TOKEN}'
        - name: domain-0-le-prod
          email: "${DOMAIN_0_EMAIL}"
          server: 'https://acme-v02.api.letsencrypt.org/directory'
          type: "cloudflare"
          cfapitoken: '${DOMAIN_0_CLOUDFLARE_TOKEN}'
        # DOMAIN_1 (Pixelfed's, app disabled): same setup, with its own Cloudflare token (DNS edit on that zone only)
        - name: domain-1-le-staging
          email: "${DOMAIN_1_EMAIL}"
          server: 'https://acme-staging-v02.api.letsencrypt.org/directory'
          type: "cloudflare"
          cfapitoken: '${DOMAIN_1_CLOUDFLARE_TOKEN}'
        - name: domain-1-le-prod
          email: "${DOMAIN_1_EMAIL}"
          server: 'https://acme-v02.api.letsencrypt.org/directory'
          type: "cloudflare"
          cfapitoken: '${DOMAIN_1_CLOUDFLARE_TOKEN}'
        # Second domain: same setup, with its own Cloudflare token (DNS edit on that zone only)
        - name: domain-2-le-staging
          email: "${DOMAIN_2_EMAIL}"
          server: 'https://acme-staging-v02.api.letsencrypt.org/directory'
          type: "cloudflare"
          cfapitoken: '${DOMAIN_2_CLOUDFLARE_TOKEN}'
        - name: domain-2-le-prod
          email: "${DOMAIN_2_EMAIL}"
          server: 'https://acme-v02.api.letsencrypt.org/directory'
          type: "cloudflare"
          cfapitoken: '${DOMAIN_2_CLOUDFLARE_TOKEN}'
