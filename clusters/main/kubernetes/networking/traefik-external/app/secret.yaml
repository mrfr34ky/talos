---
# CrowdSec bouncer key, mounted as a file (crowdsecLapiKeyFile) so it stays out of the HelmRelease object.
# Must match BOUNCER_KEY_traefik in the crowdsec LAPI (same cluster-settings variable).
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-bouncer
  namespace: traefik-external
type: Opaque
stringData:
  lapi-key: "${CROWDSEC_BOUNCER_KEY}"
