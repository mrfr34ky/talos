---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: traefik-internal
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik
      version: 41.7.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    deployment:
      replicas: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: internal
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: internal
        publishedService:
          enabled: true
      kubernetesCRD:
        enabled: true
        ingressClass: internal
        defaultTLSResourcesNamespace: traefik-internal
    ports:
      web:
        # nginx: force-ssl-redirect
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0
    tlsStore:
      default:
        defaultCertificate:
          secretName: certificate-issuer-domain-0-wildcard
    # Dashboard at https://traefik.${DOMAIN_0}/dashboard/ (trailing slash required).
    # Uses the default wildcard cert via the websecure entrypoint; LAN-only via allowlist.
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik-internal.${DOMAIN_0}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
        entryPoints: ["websecure"]
        middlewares:
          - name: lan-only
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: lan-only
          namespace: traefik-internal
        spec:
          ipAllowList:
            sourceRange:
              - 192.168.1.0/24
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: authentik
          namespace: traefik-internal
        spec:
          forwardAuth:
            address: http://authentik-http.authentik.svc.cluster.local:10230/outpost.goauthentik.io/auth/traefik
            trustForwardHeader: true
            authResponseHeaders:
              - X-authentik-username
              - X-authentik-groups
              - X-authentik-entitlements
              - X-authentik-email
              - X-authentik-name
              - X-authentik-uid
              - X-authentik-jwt
              - X-authentik-meta-jwks
              - X-authentik-meta-outpost
              - X-authentik-meta-provider
              - X-authentik-meta-app
              - X-authentik-meta-version        
    service:
      annotations:
        metallb.io/ip-allocated-from-pool: main
        metallb.io/loadBalancerIPs: ${NGINX_INTERNAL_IP}
        # Lets Blocky (k8s_gateway) resolve the dashboard host; IngressRoutes are invisible to it
        coredns.io/hostname: traefik-internal.${DOMAIN_0}
      spec:
        externalTrafficPolicy: Local
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 500Mi