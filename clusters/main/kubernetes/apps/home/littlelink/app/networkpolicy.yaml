---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: littlelink
  namespace: littlelink
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: littlelink
      app.kubernetes.io/name: littlelink
      pod.name: main
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-external
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homarr
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
