---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: mealie-values
  namespace: mealie
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  S3URL: ${S3URL}
  BUCKET: ${S3PREFIX}-mealie-15072026
  S3ID: ${S3ID}
  S3KEY: ${S3KEY}
  mealie_CNPG_PWD: "${mealie_CNPG_PWD}"
  mealie_SMTP_PWD: "${mealie_SMTP_PWD}"
