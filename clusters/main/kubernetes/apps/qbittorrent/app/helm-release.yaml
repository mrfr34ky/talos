---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent 
  namespace: qbittorrent
spec:
  interval: 15m
  chart:
    spec:
      chart: qbittorrent
      version: 26.1.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
        url: "${S3URL}"
        bucket: "${S3PREFIX}-qbit"
        accessKey: "${S3ID}"
        secretKey: "${S3KEY}"
        encrKey: "${S3KEY}"            
    service:
      torrent:
        loadBalancerIP: ${NGINX_INTERNAL_IP}
      proxy:
        enabled: true        
        ports:
          gluetun:
            enabled: true            
            port: 8888
            protocol: http
            targetPort: 8888
        type: ClusterIP           
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 5 5 * * *
      downloads:
        enabled: true
        path: /mnt/main/Media/downloads
        mountPath: /media/downloads
        server: 192.168.1.49
        type: nfs
      qbitcompleted:
        enabled: true
        path: /mnt/main/Media/downloads/completed
        mountPath: /media/downloads/completed
        server: 192.168.1.49
        type: nfs  
    # VPN service credentials for the gluetun sidecar only (not passed to qBittorrent)
    secret:
      vpn:
        enabled: true
        data:
          OPENVPN_USER: ${OPENVPN_USER}
          OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
    # All of qBittorrent's traffic leaves through the VPN; the firewall is the kill switch. The
    # chart appends the pod and service ranges to FIREWALL_OUTBOUND_SUBNETS and the web UI port to
    # FIREWALL_INPUT_PORTS. The tun device comes from generic-device-plugin.
    addons:
      gluetun:
        enabled: true
        container:
          resources:
            # The add-on defaults to true, which drops everything but cpu/memory (the tun device)
            excludeExtra: false
            limits:
              truecharts.org/tun: 1
          envFrom:
            - secretRef:
                name: vpn
          env:
            FIREWALL: "on"
            FIREWALL_OUTBOUND_SUBNETS: "192.168.1.0/24"
            VPN_SERVICE_PROVIDER: "nordvpn"
            VPN_TYPE: "openvpn"
            SERVER_COUNTRIES: "Belgium"
            SERVER_CITIES: "Brussels"
            HTTPPROXY: "on"
            HTTPPROXY_LOG: "on"
            HTTPPROXY_LISTENING_ADDRESS: :8888
            DNS_KEEP_NAMESERVER: "off"
            DNS_ADDRESS: "103.86.96.100"
            FIREWALL_INPUT_PORTS: 10095,8888  
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
              middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false
              #auth:
              #  type: "authentik"
              #  internalHost: "authentik-http.authentik.svc.cluster.local:10230"
              #  externalHost: "qbit.${DOMAIN_0}"   
          hosts:
            - host: qbit.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix        