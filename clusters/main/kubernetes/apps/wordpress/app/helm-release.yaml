---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: wordpress
spec:
  interval: 15m
  chart:
    spec:
      chart: wordpress
      version: 15.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Public website on the second domain's apex (no subdomain), through the Cloudflare Tunnel and
  # traefik-external, so CrowdSec covers it. Bitnami WordPress image; the chart's MariaDB generates
  # its own password.
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
        url: "${S3URL}"
        bucket: "${S3PREFIX}-wordpress"
        accessKey: "${S3ID}"
        secretKey: "${S3KEY}"
        encrKey: "${S3KEY}"
    wordpress:
      # Admin account, created on the first start only (an empty volume). Change the password or
      # add accounts in WordPress itself afterwards; editing these values then does nothing.
      user: "${WORDPRESS_ADMIN_USER}"
      pass: "${WORDPRESS_ADMIN_PWD}"
      email: "${DOMAIN_2_EMAIL}"
      first_name: Admin
      last_name: Admin
      blog_name: "${DOMAIN_2}"
    php-config:
      # Room for the WordPress.com export file and media uploads. The importer also downloads
      # every attachment from the old site in the same request, which takes a while.
      PHP_UPLOAD_MAX_FILESIZE: 128M
      PHP_POST_MAX_SIZE: 128M
      PHP_MAX_EXECUTION_TIME: "300"
    persistence:
      # wp-content (themes, plugins, uploads) and wp-config.php
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                # Free slot after Plex at the end of the nightly chain (UTC, 7 minutes apart)
                schedule: 52 4 * * *
    mariadb:
      # The sub-chart doesn't see the parent's credentials, so it gets its own copy
      credentials:
        s3:
          type: s3
          url: "${S3URL}"
          bucket: "${S3PREFIX}-wordpress"
          accessKey: "${S3ID}"
          secretKey: "${S3KEY}"
          encrKey: "${S3KEY}"
      persistence:
        data:
          volsync:
            - name: b2
              type: restic
              credentials: s3
              dest:
                enabled: true
              src:
                enabled: true
                trigger:
                  # 05:05 is qbittorrent's (disabled) slot; keep 7 minutes from it
                  schedule: 12 5 * * *
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          traefik:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-2-le-prod
          nginx:
            enabled: false
        hosts:
          - host: ${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix
