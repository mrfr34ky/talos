---
# Postgres only accepts authentik's pods, its own instances and the CNPG operator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-cnpg
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authentik-cnpg-main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: authentik
        - podSelector:
            matchLabels:
              cnpg.io/cluster: authentik-cnpg-main
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
---
# Incoming only from both Traefiks (UI and forward auth), Homarr and Prometheus (metrics)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-ingress
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: authentik
      app.kubernetes.io/name: authentik
      pod.name: main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-external
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homarr
      ports:
        - protocol: TCP
          port: 10230
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus-stack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 10231
---
# The worker serves nothing but metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-worker-ingress
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: authentik
      app.kubernetes.io/name: authentik
      pod.name: worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus-stack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 10235
