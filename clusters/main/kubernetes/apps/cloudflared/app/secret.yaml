---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-values
  namespace: cloudflared
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  CLOUDFLARED_TUNNEL_TOKEN: "${CLOUDFLARED_TUNNEL_TOKEN}"
