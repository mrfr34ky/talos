---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backuppc
  namespace: backuppc
spec:
  interval: 15m
  chart:
    spec:
      chart: backuppc
      version: 11.7.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    image:
      repository: ghcr.io/adferrand/backuppc
      tag: 4@sha256:81bfd8ffb014f7ce65f9354178821ea150e70849f386ba8e12a3cc11cd5532b9
      pullPolicy: IfNotPresent
    service:
      main:
        ports:
          main:
            protocol: tcp
            port: 8080  
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                BACKUPPC_UUID: "{{ .Values.securityContext.container.PUID }}"
                BACKUPPC_GUID: "{{ .Values.securityContext.pod.fsGroup }}"          
    credentials:
      s3:
        type: s3
        url: "${S3URL}"
        bucket: "${S3PREFIX}-backuppc"
        accessKey: "${S3ID}"
        secretKey: "${S3KEY}"
        encrKey: "${S3KEY}" 
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 59 0 * * *
      ssh:
        enabled: false
        mountPath: /home/backuppc
      data:
        enabled: true
        path: /mnt/main/backups
        mountPath: /data/backuppc
        server: 192.168.1.49
        type: nfs
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: true
          hosts:
            - host: backup.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix