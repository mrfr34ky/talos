---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-values
  namespace: tailscale
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  TAILSCALE_AUTH_KEY: "${TAILSCALE_AUTH_KEY}"
