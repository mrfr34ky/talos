---
# Pi-hole 2026.10.0 (FTL v6.8) refuses pages opened from links or the Authentik redirect (bug);
# without this header it falls back to its Origin check, which still blocks other websites
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-sec-fetch-site
  namespace: pihole
spec:
  headers:
    customRequestHeaders:
      Sec-Fetch-Site: ""
