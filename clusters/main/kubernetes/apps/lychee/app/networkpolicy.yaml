---
# Postgres only accepts lychee's pods, its own instances, the CNPG operator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lychee-cnpg
  namespace: lychee
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: lychee-app-template-cnpg-main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: lychee
        - podSelector:
            matchLabels:
              cnpg.io/cluster: lychee-app-template-cnpg-main
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
---
# Incoming only from traefik-internal and the sync CronJob (API uploads)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lychee-ingress
  namespace: lychee
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: lychee
      app.kubernetes.io/name: app-template
      pod.name: main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: lychee
              pod.name: sync
      ports:
        - protocol: TCP
          port: 8000
