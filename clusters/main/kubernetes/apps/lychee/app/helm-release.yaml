---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lychee
  namespace: lychee
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 21.0.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Brussels
    image:
      repository: ghcr.io/lycheeorg/lychee
      pullPolicy: IfNotPresent
      tag: v7.11.1@sha256:51d867c272c26d2a6a4c6a200e26ed888a35a7ad4652c1871953a85519a78eba
    credentials:
      s3:
        type: s3
        url: "${S3URL}"
        bucket: "${S3PREFIX}-lychee"
        accessKey: "${S3ID}"
        secretKey: "${S3KEY}"
        encrKey: "${S3KEY}"
    securityContext:
      container:
        # The entrypoint starts as root, then drops to www-data (PUID/PGID) via gosu
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        runAsUser: 0
        runAsGroup: 0
        capabilities:
          # As in upstream's compose; the frankenphp binary may carry it as a file capability
          add:
            - NET_BIND_SERVICE
    service:
      main:
        ports:
          main:
            port: 8000
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                APP_KEY: "${LYCHEE_APP_KEY}"
                APP_URL: https://memories.${DOMAIN_1}
                TIMEZONE: "{{ .Values.TZ }}"
                TRUSTED_PROXIES: "${PODNET}"
                DB_CONNECTION: pgsql
                DB_HOST:
                  secretKeyRef:
                    name: cnpg-main-urls
                    key: host
                DB_PORT: "5432"
                DB_DATABASE: lychee
                DB_USERNAME: lychee
                DB_PASSWORD:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: password
                # Skips the recursive chown/chmod of the NFS uploads on every start
                SKIP_PERMISSIONS_CHECKS: "yes"
    persistence:
      uploads:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: /mnt/main/apps/lychee
        mountPath: /app/public/uploads
      logs:
        enabled: true
        type: emptyDir
        mountPath: /app/storage/logs
      tmp:
        enabled: true
        type: emptyDir
        mountPath: /app/storage/tmp
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          traefik:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
          nginx:
            enabled: false
        hosts:
          - host: memories.${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix
    cnpg:
      main:
        enabled: true
        user: lychee
        database: lychee
        password: ${LYCHEE_CNPG_PWD}
        #mode: recovery
        cluster:
          singleNode: true
          instances: 1
        backups:
          enabled: true
          credentials: s3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 52 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          revision: "1"
          retentionPolicy: "7d"
        recovery:
          method: object_store
          credentials: s3
          revision: "1"
