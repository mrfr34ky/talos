---
# Filled by Flux from cluster-settings; kept out of the HelmRelease so the values don't land in its spec
apiVersion: v1
kind: Secret
metadata:
  name: lychee-sync
  namespace: lychee
type: Opaque
stringData:
  NC_USER: "${LYCHEE_NC_USER}"
  NC_PASS: "${LYCHEE_NC_APP_PASSWORD}"
  LYCHEE_TOKEN: "${LYCHEE_API_TOKEN}"
