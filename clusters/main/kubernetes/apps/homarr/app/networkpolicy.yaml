---
# Incoming only from traefik-internal: closes the direct path from other pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homarr-ingress
  namespace: homarr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: homarr
      app.kubernetes.io/name: homarr
      pod.name: main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
      ports:
        - protocol: TCP
          port: 7575
