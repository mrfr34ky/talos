---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: syncthing-values
  namespace: syncthing
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  S3URL: ${S3URL}
  BUCKET: ${S3PREFIX}-syncthing-14072026
  S3ID: ${S3ID}
  S3KEY: ${S3KEY}
