---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: littlelink
  namespace: littlelink
spec:
  interval: 15m
  chart:
    spec:
      chart: littlelink
      version: 19.0.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Brussels
    configmap:
      theme:
        enabled: true
        data:
          dark.css: |
            :root {
              --bg-color: #292929;
              --hr-color: #F1F1F1;
              --code-color: #F1F1F1;
              --font-color: #FFFFFF;
              --a-color: #0085FF;
              --border-color: #292929;
              --button-border-style: none;
            }
            body {
              background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url("https://raw.githubusercontent.com/b-a-l-a-z-s/assets/main/background.jpg") center / cover fixed;
            }
    persistence:
      theme:
        enabled: true
        type: configmap
        objectName: theme
        mountPath: /usr/src/app/build/public/css/dark.css
        subPath: dark.css
        readOnly: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                META_TITLE: ""
                META_DESCRIPTION: ${LITTLELINK_BIO}
                META_AUTHOR: ${LITTLELINK_NAME}
                META_INDEX_STATUS: noindex
                THEME: Dark
                AVATAR_URL: https://gravatar.com/avatar/${LITTLELINK_GRAVATAR}?s=128
                AVATAR_2X_URL: https://gravatar.com/avatar/${LITTLELINK_GRAVATAR}?s=256
                AVATAR_ALT: ${LITTLELINK_NAME}
                NAME: ${LITTLELINK_NAME}
                BIO: ${LITTLELINK_BIO}
                BUTTON_ORDER: FACEBOOK,INSTAGRAM,LINKED_IN,YOUTUBE,STRAVA,GITHUB
                GITHUB: https://github.com/b-a-l-a-z-s
                #PIXELFED: ${LITTLELINK_PIXELFED}
                INSTAGRAM: ${LITTLELINK_INSTAGRAM}
                FACEBOOK: ${LITTLELINK_FACEBOOK}
                YOUTUBE: ${LITTLELINK_YOUTUBE}
                LINKED_IN: ${LITTLELINK_LINKEDIN}
                STRAVA: ${LITTLELINK_STRAVA}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          traefik:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
          nginx:
            enabled: false
        hosts:
          - host: ${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix
