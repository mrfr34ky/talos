---
# Postgres only accepts paperless-ngx's pods, its own instances and the CNPG operator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-ngx-cnpg
  namespace: paperless-ngx
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: paperless-ngx-cnpg-main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: paperless-ngx
        - podSelector:
            matchLabels:
              cnpg.io/cluster: paperless-ngx-cnpg-main
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
---
# Redis only accepts paperless-ngx's pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-ngx-redis
  namespace: paperless-ngx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: paperless-ngx
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: paperless-ngx
      ports:
        - protocol: TCP
          port: 6379
