---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gallery-dl
  namespace: gallery-dl
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 21.0.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Brussels
    image:
      repository: docker.io/mikf123/gallery-dl
      pullPolicy: IfNotPresent
      tag: 2026.10.21@sha256:b945e28b87af45831253d0f67525f227c0513db15f586b6692a7942147b91b28
    resources:
      limits:
        memory: 1Gi
    securityContext:
      container:
        runAsUser: 568
        runAsGroup: 568
        readOnlyRootFilesystem: true
    service:
      main:
        enabled: false
    workload:
      main:
        type: CronJob
        schedule: "30 6 * * *"
        backoffLimit: 1
        activeDeadlineSeconds: 14400
        podSpec:
          restartPolicy: Never
          containers:
            main:
              args:
                - --config
                - /secrets/config.json
                - --input-file
                - /secrets/accounts.txt
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
    persistence:
      secrets:
        enabled: true
        type: secret
        objectName: gallery-dl
        expandObjectName: false
        mountPath: /secrets
        readOnly: true
      data:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: ${GALLERY_DL_PATH}
        mountPath: /data
