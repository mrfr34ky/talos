---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
  namespace: tdarr
spec:
  interval: 15m
  chart:
    spec:
      chart: tdarr
      version: 13.33.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m          
    credentials:
      s3:
        type: s3
        url: "${S3URL}"
        bucket: "${S3PREFIX}-tdarr"
        accessKey: "${S3ID}"
        secretKey: "${S3KEY}"
        encrKey: "${S3KEY}" 
    persistence:
      configs:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 10 4 * * *
      media:
        enabled: true
        path: /mnt/main/Media/
        mountPath: /media
        server: 192.168.1.49
        type: nfs 
      logs:
        enabled: false
        mountPath: "/app/logs"           
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                webUIPort: "{{ .Values.service.main.ports.main.port }}"
                serverPort: "{{ .Values.service.comm.ports.comm.port }}"
                # User Defined
                internalNode: true
                serverIP: "127.0.0.1"
                nodeID: "Internal Node"
                #seededApiKey: "${TDARR_API}"
                #apiKey: "${TDARR_API}"
                #auth: true
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: true
              #auth:
              #  type: "authentik"
              #  internalHost: "authentik-http.authentik.svc.cluster.local:10230"
              #  externalHost: "tdarr.${DOMAIN_0}"  
          hosts:
            - host: tdarr.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix