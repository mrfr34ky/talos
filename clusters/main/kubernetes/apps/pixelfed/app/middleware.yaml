---
# Pixelfed's landing page has no off switch: the bare address goes straight to the gallery.
# $${1} is escaped for Flux substitution; Traefik receives ${1}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: root-to-profile
  namespace: pixelfed
spec:
  redirectRegex:
    regex: ^(https?://[^/]+)/?$
    replacement: $${1}/Balazs
    permanent: false
