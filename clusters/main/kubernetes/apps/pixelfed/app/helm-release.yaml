---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pixelfed
  namespace: pixelfed
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 21.0.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Pixelfed (federated photo sharing) on the jippi/docker-pixelfed image, public through the
  # Cloudflare Tunnel and traefik-external; LAN clients reach the same ingress directly.
  # No Authentik: the ActivityPub endpoints must stay open to other servers.
  # APP_DOMAIN is written into every federated post and handle, so the host can't change once the
  # instance has federated.
  # One pod runs the web server, the Horizon queue worker and the scheduler, so the media share
  # needs no RWX volume. Each container runs the image's entrypoint (caches, storage link); only
  # the web container runs the first-time setup and the database migrations.
  values:
    global:
      stopAll: false
      traefik:
        # The chart's default headers middleware answers CORS preflights itself, with no allowed
        # origin, which breaks browser-based Mastodon clients. Pixelfed handles CORS for its API.
        commonMiddlewares: []
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    image:
      repository: ghcr.io/jippi/docker-pixelfed
      pullPolicy: IfNotPresent
      tag: v0.15.2-apache-8.4-bookworm@sha256:f29f79ce02e1bc28a9faa3a7eceba6d5a31f1a7b8d1c87d5b89a73d28c17f9a2
    # The entrypoint starts as root and drops to www-data (uid 33) through su/gosu; Apache binds
    # port 80 as root. The chart adds CHOWN/SETUID/SETGID/FOWNER/DAC_OVERRIDE and NET_BIND_SERVICE.
    securityContext:
      container:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        runAsUser: 0
        runAsGroup: 0
        capabilities:
          # Apache's root parent signals its www-data children; su writes an audit record
          add:
            - KILL
            - AUDIT_WRITE
    service:
      main:
        ports:
          main:
            port: 80
    # Pixelfed reads its settings from the environment; Laravel gives these precedence over .env
    configmap:
      env:
        enabled: true
        data:
          APP_NAME: Memories
          APP_ENV: production
          APP_DEBUG: "false"
          APP_URL: https://memories.${DOMAIN_1}
          APP_DOMAIN: memories.${DOMAIN_1}
          ADMIN_DOMAIN: memories.${DOMAIN_1}
          SESSION_DOMAIN: memories.${DOMAIN_1}
          # Pixelfed expects UTC internally; TZ (Europe/Brussels) still sets the container clock
          APP_TIMEZONE: UTC
          # Requests come through cloudflared and Traefik
          TRUST_PROXIES: "*"
          # Accounts are created by the admin only (php artisan user:create)
          OPEN_REGISTRATION: "false"
          ENFORCE_EMAIL_VERIFICATION: "true"
          # Instagram import without the default 1-day account age
          PF_IMPORT_IG_PERM_MIN_ACCOUNT_AGE: "0"
          # Largest file in KB (uploads and the Instagram import, videos included), under Cloudflare's
          # 100 MB request limit; the admin setting (Settings → Media) overrides it once saved
          MAX_PHOTO_SIZE: "95000"
          # PHP request limit; the import sends up to 10 files per request (Apache allows 1 GiB)
          POST_MAX_SIZE: "1000M"
          # Public (landing page, instance API); never empty: the image's Apache config uses it as ServerAdmin
          INSTANCE_CONTACT_EMAIL: ${PIXELFED_CONTACT_EMAIL}
          # Visitors can browse the timeline, Discover and hashtag pages without logging in (env only)
          INSTANCE_PUBLIC_LOCAL_TIMELINE: "true"
          INSTANCE_DISCOVER_PUBLIC: "true"
          INSTANCE_PUBLIC_HASHTAGS: "true"
          # Mastodon-compatible API with personal access tokens (mobile apps, the Memories poster)
          OAUTH_ENABLED: "true"
          ACTIVITY_PUB: "true"
          AP_REMOTE_FOLLOW: "true"
          AP_INBOX: "true"
          AP_OUTBOX: "true"
          AP_SHAREDINBOX: "true"
          DB_CONNECTION: mysql
          DB_HOST: '{{ printf "%s-mariadb" .Release.Name }}'
          DB_PORT: "3306"
          DB_DATABASE: pixelfed
          DB_USERNAME: pixelfed
          # Renovate image updates otherwise leave new migrations pending
          DB_APPLY_NEW_MIGRATIONS_AUTOMATICALLY: "1"
          REDIS_CLIENT: phpredis
          REDIS_HOST: '{{ printf "%s-redis" .Release.Name }}'
          REDIS_PORT: "6379"
          CACHE_DRIVER: redis
          BROADCAST_DRIVER: redis
          QUEUE_DRIVER: redis
          SESSION_DRIVER: database
          MAIL_DRIVER: smtp
          MAIL_MAILER: smtp
          MAIL_HOST: smtp.gmail.com
          MAIL_PORT: "587"
          MAIL_ENCRYPTION: tls
          MAIL_USERNAME: ${GMAIL_USER}
          MAIL_FROM_ADDRESS: ${GMAIL_USER}
          MAIL_FROM_NAME: Memories
          LOG_CHANNEL: stderr
          LOG_LEVEL: info
          # PHP memory for image processing (the image's default is 128M)
          DOCKER_APP_PHP_MEMORY_LIMIT: 256M
      # The entrypoint scripts expect /var/www/.env to exist; the settings above make it unnecessary
      dotenv:
        enabled: true
        data:
          .env: |
            # Settings come from the environment (HelmRelease values), not from this file.
      # Pixelfed's sw.js, but form posts and /oauth/ go straight to the browser: the stock worker turns
      # the app login's redirect to pixelfed://oauth-callback into its "You are offline" page
      serviceworker:
        enabled: true
        data:
          sw.js: |
            const OFFLINE_VERSION = 2;
            const CACHE_NAME = "offline";
            const OFFLINE_URL = "/offline.html";

            self.addEventListener("install", (event) => {
            	event.waitUntil(
            		(async () => {
            			const cache = await caches.open(CACHE_NAME);
            			await cache.add(new Request(OFFLINE_URL, { cache: "reload" }));
            		})()
            	);
            	self.skipWaiting();
            });

            self.addEventListener("activate", (event) => {
            	event.waitUntil(
            		(async () => {
            			if ("navigationPreload" in self.registration) {
            				await self.registration.navigationPreload.enable();
            			}
            		})()
            	);
            	self.clients.claim();
            });

            self.addEventListener("fetch", (event) => {
            	const url = new URL(event.request.url);
            	if (event.request.mode !== "navigate" || event.request.method !== "GET" || url.pathname.startsWith("/oauth/")) {
            		return;
            	}
            	event.respondWith(
            		(async () => {
            			try {
            				const preloadResponse = await event.preloadResponse;
            				if (preloadResponse) {
            					return preloadResponse;
            				}
            				const networkResponse = await fetch(event.request);
            				return networkResponse;
            			} catch (error) {
            				const cache = await caches.open(CACHE_NAME);
            				const cachedResponse = await cache.match(OFFLINE_URL);
            				return cachedResponse;
            			}
            		})()
            	);
            });
      # Patched Pixelfed PHP files (mounted below, persistence patch-*): Guzzle 8 rejects CURLOPT_PROTOCOLS,
      # which broke handle lookups and remote media. Remove once upstream ships the fix (PR #7779 covers media)
      phppatches:
        enabled: true
        data:
          FetchCacheService.php: |
            <?php

            namespace App\Services;

            use App\Util\ActivityPub\Helpers;
            use Illuminate\Http\Client\ConnectionException;
            use Illuminate\Http\Client\RequestException;
            use Illuminate\Support\Facades\Cache;
            use Illuminate\Support\Facades\Http;

            class FetchCacheService
            {
                const CACHE_KEY = 'pf:fetch_cache_service:getjson:';

                public static function getJson($url, $verifyCheck = true, $ttl = 3600, $allowRedirects = true)
                {
                    $vc = $verifyCheck ? 'vc1:' : 'vc0:';
                    $ar = $allowRedirects ? 'ar1:' : 'ar0';
                    $key = self::CACHE_KEY.sha1($url).':'.$vc.$ar.$ttl;
                    if (Cache::has($key)) {
                        return Cache::get($key);
                    }

                    if ($verifyCheck) {
                        $validated = Helpers::validateUrl($url);
                        if (! $validated) {
                            Cache::put($key, 1, $ttl);

                            return false;
                        }
                        $url = $validated;
                    }

                    $headers = [
                        'User-Agent' => '(Pixelfed/'.config('pixelfed.version').'; +'.config('app.url').')',
                    ];

                    // SSRF-hardening: resolve the host and pin the connection to a
                    // validated public IP. Auto-redirects are disabled so a remote host
                    // cannot steer the request into an internal address on a later hop.
                    $host = parse_url($url, PHP_URL_HOST);
                    $port = parse_url($url, PHP_URL_PORT) ?: 443;
                    $ips = $host ? Helpers::resolvePublicIps($host) : [];
                    if ($ips === []) {
                        Cache::put($key, 1, $ttl);

                        return false;
                    }

                    $options = [
                        'allow_redirects' => false,
                        // talos patch: Guzzle 8 rejects CURLOPT_PROTOCOLS in curl options; use its own option (pixelfed PR #7779)
                        'protocols' => ['https'],
                        'curl' => [
                            CURLOPT_RESOLVE => [
                                $host.':'.((int) $port).':'.implode(',', array_map(
                                    fn ($ip) => str_contains($ip, ':') ? '['.$ip.']' : $ip,
                                    $ips
                                )),
                            ],
                            CURLOPT_FRESH_CONNECT => true,
                            CURLOPT_FORBID_REUSE => true,
                        ],
                    ];

                    try {
                        $res = Http::withOptions($options)
                            ->retry(3, function (int $attempt, $exception) {
                                return $attempt * 500;
                            })
                            ->acceptJson()
                            ->withHeaders($headers)
                            ->timeout(40)
                            ->get($url);
                    } catch (RequestException|ConnectionException|\Exception) {
                        Cache::put($key, 1, $ttl);

                        return false;
                    }

                    if (! $res->ok()) {
                        Cache::put($key, 1, $ttl);

                        return false;
                    }

                    $result = $res->json();
                    Cache::put($key, $result, $ttl);

                    return $result;
                }
            }
          SecureMediaFetchService.php: |
            <?php

            namespace App\Services;

            use App\Util\ActivityPub\Helpers;
            use Illuminate\Http\Client\ConnectionException;
            use Illuminate\Http\Client\RequestException;
            use Illuminate\Http\Client\Response;
            use Illuminate\Support\Facades\Http;
            use League\Uri\BaseUri;
            use Psr\Http\Message\ResponseInterface;

            /**
             * SSRF-hardened fetcher for remote media (avatars, attachments).
             *
             * Unlike a bare Guzzle client or file_get_contents(), this service:
             *   - validates the URL (https-only, no userinfo, normalized host);
             *   - resolves the host and refuses any non-global (private/reserved/
             *     link-local) IP, closing the metadata.google.internal style bypass
             *     where a public-looking hostname resolves into a reserved range;
             *   - pins the connection to the already-validated IPs via CURLOPT_RESOLVE
             *     so the address we validated is the address we connect to (no
             *     TOCTOU / DNS-rebinding window);
             *   - never lets the HTTP client follow redirects automatically, instead
             *     re-validating and re-resolving every hop;
             *   - enforces a hard byte cap.
             */
            class SecureMediaFetchService
            {
                private const int MAX_REDIRECTS = 2;

                private const int CONNECT_TIMEOUT = 5;

                private const int TIMEOUT = 15;

                /**
                 * Perform a HEAD request through the pinned, validated path.
                 *
                 * @return array{length:int,mime:string}|false
                 */
                public static function head(string $url, ?int $maxBytes = null)
                {
                    $maxBytes = $maxBytes ?? self::defaultMaxBytes();

                    return (new self)->request($url, 'head', $maxBytes);
                }

                /**
                 * Download up to $maxBytes of the resource through the pinned,
                 * validated path. Returns the raw body string, or false.
                 *
                 * @return string|false
                 */
                public static function get(string $url, ?int $maxBytes = null, ?int $expectedLength = null, array $headers = [])
                {
                    $maxBytes = $maxBytes ?? self::defaultMaxBytes();
                    $result = (new self)->request($url, 'get', $maxBytes, $expectedLength, $headers);

                    if (! is_array($result)) {
                        return false;
                    }

                    return $result['body'] ?? false;
                }

                /**
                 * Shared request loop: validate -> resolve public IPs -> pin -> issue
                 * request with redirects disabled -> re-validate each hop.
                 *
                 * @return array|false For 'head': ['length'=>int,'mime'=>string].
                 *                     For 'get': ['body'=>string,'length'=>int,'mime'=>string].
                 */
                protected function request(string $url, string $method, int $maxBytes, ?int $expectedLength = null, array $extraHeaders = [])
                {
                    $currentUrl = $url;

                    // Host of the original request. Caller-supplied headers (e.g. an
                    // Authorization bearer token) are only sent to this host and are
                    // stripped on any cross-origin redirect hop, mirroring Guzzle's
                    // RedirectMiddleware credential-stripping behaviour. Captured from
                    // the first validated hop so the comparison uses the same host
                    // normalization (case, trailing dot, IDN punycode) as every hop.
                    $originHost = null;

                    for ($redirects = 0; $redirects <= self::MAX_REDIRECTS; $redirects++) {
                        $currentUrl = Helpers::validateUrl($currentUrl);

                        if (! $currentUrl) {
                            return false;
                        }

                        $host = parse_url($currentUrl, PHP_URL_HOST);
                        $scheme = parse_url($currentUrl, PHP_URL_SCHEME);
                        $port = parse_url($currentUrl, PHP_URL_PORT) ?: 443;

                        if (! $host || strtolower((string) $scheme) !== 'https') {
                            return false;
                        }

                        // validateUrl() already rebuilt the url with a normalized host,
                        // but normalize again so the origin comparison is defensive and
                        // uses identical case/trailing-dot/punycode rules on every hop.
                        $host = Helpers::normalizeHostLoose($host);

                        if (! $host) {
                            return false;
                        }

                        if ($originHost === null) {
                            $originHost = $host;
                        }

                        // Only forward caller headers when the current hop is the same host
                        // as the original request; drop them across origins.
                        $headers = ['User-Agent' => self::userAgent()];
                        if (! empty($extraHeaders) && $host === $originHost) {
                            $headers = array_merge($extraHeaders, $headers);
                        }

                        // Resolve the host and reject if ANY resolved address is
                        // non-global. Fail-closed: empty means unresolved or private.
                        $ips = Helpers::resolvePublicIps($host);

                        if (empty($ips)) {
                            return false;
                        }

                        try {
                            $res = $this->send($method, $currentUrl, $host, (int) $port, $ips, $headers, $maxBytes);

                            if ($method === 'head' && $this->shouldProbe($res)) {
                                // Buffered (non-stream) 1-byte range probe: streaming can't
                                // carry the CURLOPT_RESOLVE pin under Guzzle 8's stream
                                // handler, and a single byte is safe to buffer. The byte
                                // cap is still enforced up front by the on_headers callback.
                                $res = $this->send('get', $currentUrl, $host, (int) $port, $ips, array_merge($headers, ['Range' => 'bytes=0-0']), $maxBytes);
                            }
                        } catch (RequestException|ConnectionException|\Throwable) {
                            return false;
                        }

                        // Manual redirect handling: re-validate + re-resolve the next hop.
                        if (in_array($res->status(), [301, 302, 303, 307, 308], true)) {
                            if ($redirects >= self::MAX_REDIRECTS) {
                                return false;
                            }
                            $location = $res->header('Location');
                            if (! $location) {
                                return false;
                            }
                            $nextUrl = $this->resolveRedirect($currentUrl, $location);
                            if (! $nextUrl) {
                                return false;
                            }
                            $currentUrl = $nextUrl;

                            continue;
                        }

                        if (! $res->successful()) {
                            return false;
                        }

                        $mime = $this->normalizeMime($res->header('Content-Type'));
                        $declaredLength = $this->declaredLength($res);

                        if ($method === 'head') {
                            if ($declaredLength === null || $mime === null) {
                                return false;
                            }
                            if ($declaredLength < 10 || $declaredLength > $maxBytes) {
                                return false;
                            }

                            return ['length' => $declaredLength, 'mime' => $mime];
                        }

                        // GET: enforce the cap against the actual body we received.
                        $body = $res->body();
                        $len = strlen($body);

                        if ($len === 0 || $len > $maxBytes) {
                            return false;
                        }

                        if ($expectedLength !== null && $len < $expectedLength) {
                            // Received less than the HEAD promised; treat as truncated.
                            // Still return what we have, capped, but never more than asked.
                            $body = substr($body, 0, $expectedLength);
                            $len = strlen($body);
                        }

                        return [
                            'body' => $body,
                            'length' => $len,
                            'mime' => $mime ?? ($declaredLength !== null ? $mime : null),
                        ];
                    }

                    return false;
                }

                protected function send(string $method, string $url, string $host, int $port, array $ips, array $headers, int $maxBytes): Response
                {
                    return Http::withOptions($this->requestOptions($host, $port, $ips, $maxBytes))
                        ->withHeaders($headers)
                        ->timeout(self::TIMEOUT)
                        ->connectTimeout(self::CONNECT_TIMEOUT)
                        ->{$method}($url);
                }

                /**
                 * Build the client options for a single hop. The scheme is restricted to
                 * https via Guzzle's native 'protocols' option (accepted by the curl
                 * handler, unlike the CURLOPT_PROTOCOLS curl constant), redirects stay
                 * disabled so every hop is re-validated, and the connection is pinned to
                 * the already-validated IPs through CURLOPT_RESOLVE. Responses are
                 * buffered (never streamed) so the curl handler, which is the only one
                 * that honours the CURLOPT_RESOLVE pin under Guzzle 8, is always used.
                 */
                protected function requestOptions(string $host, int $port, array $ips, int $maxBytes): array
                {
                    return [
                        'allow_redirects' => false,
                        'protocols' => ['https'],
                        'sink' => null,
                        'stream' => false,
                        'curl' => [
                            CURLOPT_RESOLVE => [
                                $this->buildResolveEntry($host, $port, $ips),
                            ],
                            CURLOPT_FRESH_CONNECT => true,
                            CURLOPT_FORBID_REUSE => true,
                        ],
                        'on_headers' => function (ResponseInterface $response) use ($maxBytes) {
                            $length = $response->getHeaderLine('Content-Length');
                            if ($length !== '' && ctype_digit($length) && (int) $length > $maxBytes) {
                                throw new \RuntimeException('Remote media exceeds maximum size');
                            }
                        },
                    ];
                }

                protected function shouldProbe(Response $res): bool
                {
                    if (in_array($res->status(), [403, 405, 501], true)) {
                        return true;
                    }

                    if (! $res->successful()) {
                        return false;
                    }

                    return $this->declaredLength($res) === null
                        || $this->normalizeMime($res->header('Content-Type')) === null;
                }

                protected function declaredLength(Response $res): ?int
                {
                    if ($res->status() === 206) {
                        $range = trim((string) $res->header('Content-Range'));

                        if (preg_match('#^bytes\s+\d+-\d+/(\d+)$#i', $range, $matches)) {
                            return (int) $matches[1];
                        }

                        return null;
                    }

                    $length = (string) $res->header('Content-Length');

                    return ctype_digit($length) ? (int) $length : null;
                }

                protected function buildResolveEntry(string $host, int $port, array $ips): string
                {
                    $addresses = array_map(function ($ip) {
                        return str_contains($ip, ':') ? '['.$ip.']' : $ip;
                    }, $ips);

                    return $host.':'.$port.':'.implode(',', $addresses);
                }

                protected function resolveRedirect(string $baseUrl, string $location): ?string
                {
                    $location = trim($location);

                    if ($location === '' || preg_match('/[\x00-\x20\x7f]/', $location)) {
                        return null;
                    }

                    try {
                        $resolved = (string) BaseUri::from($baseUrl)->resolve($location);

                        return Helpers::validateUrl($resolved) ? $resolved : null;
                    } catch (\Throwable) {
                        return null;
                    }
                }

                protected function normalizeMime(?string $contentType): ?string
                {
                    if (! $contentType) {
                        return null;
                    }

                    $mime = strtolower(trim(explode(';', $contentType)[0]));

                    return $mime === '' ? null : $mime;
                }

                protected static function defaultMaxBytes(): int
                {
                    // Cap on the larger of avatar/photo config limits (kB -> bytes),
                    // with a sane fallback.
                    $photo = (int) config_cache('pixelfed.max_photo_size');
                    $avatar = (int) config('pixelfed.max_avatar_size');
                    $maxKb = max($photo, $avatar, 1000);

                    return $maxKb * 1000;
                }

                protected static function userAgent(): string
                {
                    return 'PixelFedBot/1.0.0 (Pixelfed/'.config('pixelfed.version').'; +'.config('app.url').')';
                }
            }
          CustomEmojiService.php: |
            <?php

            namespace App\Services;

            use App\Models\CustomEmoji;
            use App\Util\ActivityPub\Helpers;
            use Illuminate\Http\Client\RequestException;
            use Illuminate\Support\Facades\Cache;
            use Illuminate\Support\Facades\Http;
            use Illuminate\Support\Facades\Storage;

            class CustomEmojiService
            {
                /**
                 * Allowed image mime types for imported custom emoji.
                 */
                public const ALLOWED_MIME_TYPES = [
                    'image/jpeg',
                    'image/jpg',
                    'image/png',
                    'image/gif',
                    'image/webp',
                ];

                public static function get($shortcode)
                {
                    if ((bool) config_cache('federation.custom_emoji.enabled') === false) {
                        return;
                    }

                    return CustomEmoji::whereShortcode($shortcode)->first();
                }

                public static function import($url, $id = false)
                {
                    if ((bool) config_cache('federation.custom_emoji.enabled') === false) {
                        return;
                    }

                    $url = Helpers::validateUrl($url);
                    if ($url == false) {
                        return;
                    }

                    $emoji = CustomEmoji::whereUri($url)->first();
                    if ($emoji) {
                        return;
                    }

                    // SSRF-hardened JSON fetch: resolve + pin the host to a validated
                    // public IP and refuse redirects so the emoji-document request cannot
                    // be steered into internal addresses.
                    $host = parse_url($url, PHP_URL_HOST);
                    $port = parse_url($url, PHP_URL_PORT) ?: 443;
                    $ips = $host ? Helpers::resolvePublicIps($host) : [];
                    if ($ips === []) {
                        return;
                    }

                    try {
                        $res = Http::acceptJson()
                            ->withOptions([
                                'allow_redirects' => false,
                                // talos patch: Guzzle 8 rejects CURLOPT_PROTOCOLS in curl options; use its own option (pixelfed PR #7779)
                                'protocols' => ['https'],
                                'curl' => [
                                    CURLOPT_RESOLVE => [
                                        $host.':'.((int) $port).':'.implode(',', array_map(
                                            fn ($ip) => str_contains($ip, ':') ? '['.$ip.']' : $ip,
                                            $ips
                                        )),
                                    ],
                                    CURLOPT_FRESH_CONNECT => true,
                                    CURLOPT_FORBID_REUSE => true,
                                ],
                            ])
                            ->timeout(15)
                            ->connectTimeout(5)
                            ->get($url);
                    } catch (RequestException|\Exception) {
                        return;
                    }

                    if ($res->successful()) {
                        $json = $res->json();

                        if (
                            ! $json ||
                            ! isset($json['id']) ||
                            ! isset($json['type']) ||
                            $json['type'] !== 'Emoji' ||
                            ! isset($json['icon']) ||
                            ! isset($json['icon']['mediaType']) ||
                            ! isset($json['icon']['url']) ||
                            ! isset($json['icon']['type']) ||
                            $json['icon']['type'] !== 'Image' ||
                            ! in_array($json['icon']['mediaType'], self::ALLOWED_MIME_TYPES, true)
                        ) {
                            return;
                        }

                        if (Helpers::validateUrl($json['icon']['url']) == false) {
                            return;
                        }

                        if (! self::headCheck($json['icon']['url'])) {
                            return;
                        }

                        // The (shortcode, domain) collision key is derived from the
                        // document's declared id, so its host must match the URL we
                        // actually fetched. Otherwise a peer could serve a document from
                        // its own host declaring a victim (shortcode, host) and hijack /
                        // clobber the victim's cached emoji. Host-only (not byte equality)
                        // so a legit id whose path differs from the fetch URL still passes.
                        if (strcasecmp((string) parse_url($json['id'], PHP_URL_HOST), (string) parse_url($url, PHP_URL_HOST)) !== 0) {
                            return;
                        }

                        $emoji = CustomEmoji::updateOrCreate([
                            'shortcode' => $json['name'],
                            'domain' => parse_url($json['id'], PHP_URL_HOST),
                        ], [
                            'uri' => $json['id'],
                            'image_remote_url' => $json['icon']['url'],
                        ]);

                        $ext = '.'.last(explode('/', $json['icon']['mediaType']));
                        $mediaPath = 'emoji/'.$emoji->id.$ext;

                        try {
                            // SSRF-hardened: validated URL, resolved+pinned public IP,
                            // no internal redirects, size-capped.
                            $maxSize = (int) config('federation.custom_emoji.max_size');
                            $body = SecureMediaFetchService::get($json['icon']['url'], $maxSize > 0 ? $maxSize : null);

                            if ($body === false) {
                                // Download failed: keep the previous working media rather
                                // than deleting it up-front, so the emoji keeps rendering.
                                return;
                            }

                            // Store the new bytes first, persist media_path, and only then
                            // delete the previous file if the path changed.
                            $oldPath = ($emoji->media_path && $emoji->media_path !== $mediaPath)
                                ? $emoji->media_path
                                : null;

                            Storage::put('public/'.$mediaPath, $body);

                            $emoji->media_path = $mediaPath;
                            $emoji->save();

                            if ($oldPath && Storage::exists('public/'.$oldPath)) {
                                Storage::delete('public/'.$oldPath);
                            }
                        } catch (\Exception) {
                            // Download failed
                            return;
                        }

                        $name = str_replace(':', '', $json['name']);
                        Cache::forget('pf:custom_emoji');
                        Cache::forget('pf:custom_emoji:'.$name);
                        if ($id) {
                            StatusService::del($id);
                        }

                        return;
                    }

                }

                public static function headCheck($url)
                {
                    $maxSize = (int) config('federation.custom_emoji.max_size');
                    // SSRF-hardened HEAD: validated URL, resolved+pinned public IP, no
                    // internal redirects.
                    $head = SecureMediaFetchService::head($url, $maxSize > 0 ? $maxSize : null);

                    if (! $head) {
                        return false;
                    }

                    if (! in_array($head['mime'], self::ALLOWED_MIME_TYPES, true)) {
                        return false;
                    }

                    return $maxSize <= 0 || $head['length'] <= $maxSize;
                }

                /**
                 * Re-download a remote custom emoji's media from its origin
                 * (image_remote_url) and store it locally under public/{media_path}.
                 *
                 * Used by admin:resyncemoji to repair emoji whose local file is missing
                 * or corrupt. Only remote emoji (those with an origin URL) can be resynced.
                 *
                 * @return string one of: resynced|skipped|failed
                 */
                public static function resync(CustomEmoji $emoji): string
                {
                    if ((bool) config_cache('federation.custom_emoji.enabled') === false) {
                        return 'skipped';
                    }

                    // Only remote emoji have an origin URL to re-fetch from.
                    if (empty($emoji->image_remote_url)) {
                        return 'skipped';
                    }

                    $url = Helpers::validateUrl($emoji->image_remote_url);
                    if ($url == false) {
                        return 'skipped';
                    }

                    if (! self::headCheck($url)) {
                        return 'failed';
                    }

                    // Preserve the existing media_path when present; otherwise derive one
                    // from the emoji id and the origin URL's extension.
                    $mediaPath = $emoji->media_path;
                    if (! $mediaPath) {
                        $ext = pathinfo(parse_url($url, PHP_URL_PATH) ?? '', PATHINFO_EXTENSION);
                        $ext = $ext ? '.'.strtolower($ext) : '.png';
                        $mediaPath = 'emoji/'.$emoji->id.$ext;
                    }

                    try {
                        $maxSize = (int) config('federation.custom_emoji.max_size');
                        $body = SecureMediaFetchService::get($url, $maxSize > 0 ? $maxSize : null);

                        if ($body === false) {
                            return 'failed';
                        }

                        if (Storage::exists('public/'.$mediaPath)) {
                            Storage::delete('public/'.$mediaPath);
                        }

                        Storage::put('public/'.$mediaPath, $body);

                        if ($emoji->media_path !== $mediaPath) {
                            $emoji->media_path = $mediaPath;
                            $emoji->save();
                        }
                    } catch (\Throwable) {
                        return 'failed';
                    }

                    $name = str_replace(':', '', (string) $emoji->shortcode);
                    Cache::forget('pf:custom_emoji');
                    Cache::forget('pf:custom_emoji:'.$name);

                    return 'resynced';
                }

                public static function all()
                {
                    return Cache::rememberForever('pf:custom_emoji', function () {
                        $pgsql = db_is_pgsql();

                        return CustomEmoji::when(! $pgsql, function ($q, $pgsql) {
                            return $q->groupBy('shortcode');
                        })
                            ->whereNull('uri')
                            ->get()
                            ->map(function ($emojo) {
                                $url = url('storage/'.$emojo->media_path);

                                return [
                                    'shortcode' => str_replace(':', '', $emojo->shortcode),
                                    'url' => $url,
                                    'static_url' => $url,
                                    'visible_in_picker' => $emojo->disabled == false,
                                ];
                            })
                            ->when($pgsql, function ($collection) {
                                return $collection->unique('shortcode');
                            })
                            ->toJson(JSON_UNESCAPED_SLASHES);
                    });
                }
            }
    secret:
      env:
        enabled: true
        data:
          # Laravel encryption key (base64:...). Never change it: sessions, 2FA secrets and other
          # encrypted data in the database become unreadable.
          APP_KEY: ${PIXELFED_APP_KEY}
          MAIL_PASSWORD: ${PIXELFED_SMTP_PWD}
      # vpn:
        # enabled: true
        # data:
          # OPENVPN_USER: ${PRIVADO_USER}
          # OPENVPN_PASSWORD: ${PRIVADO_PWD}
    workload:
      main:
        podSpec:
          containers:
            main:
              envFrom:
                - configMapRef:
                    name: env
                - secretRef:
                    name: env
              env:
                DOCKER_SERVICE_NAME: web
                # 01 chowns the read-only .env and the NFS share; 02 only lints .env
                ENTRYPOINT_SKIP_SCRIPTS: "01-permissions.sh 02-check-config.sh"
                DB_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                    key: mariadb-password
                REDIS_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: redis-password
              # Pixelfed's routes only answer on APP_DOMAIN, so the probes send that Host header
              probes:
                liveness:
                  enabled: true
                  type: http
                  path: /api/service/health-check
                  httpHeaders:
                    Host: memories.${DOMAIN_1}
                readiness:
                  enabled: true
                  type: http
                  path: /api/service/health-check
                  httpHeaders:
                    Host: memories.${DOMAIN_1}
                startup:
                  enabled: true
                  type: http
                  path: /api/service/health-check
                  httpHeaders:
                    Host: memories.${DOMAIN_1}
                  spec:
                    # The first start migrates the database and imports the city list
                    initialDelaySeconds: 10
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 90
                    successThreshold: 1
            # The worker and the scheduler skip the first-time setup and the migrations (web runs them)
            horizon:
              enabled: true
              primary: false
              imageSelector: image
              args:
                - gosu
                - www-data
                - php
                - artisan
                - horizon
              envFrom:
                - configMapRef:
                    name: env
                - secretRef:
                    name: env
              # Image jobs hold ImageMagick memory outside PHP's limit: fewer workers, more room (OOMs at 2.4Gi)
              resources:
                requests:
                  cpu: 10m
                  memory: 200Mi
                limits:
                  cpu: 1500m
                  memory: 4Gi
              env:
                DOCKER_SERVICE_NAME: worker
                ENTRYPOINT_SKIP_SCRIPTS: "01-permissions.sh 02-check-config.sh 11-first-time-setup.sh 12-migrations.sh"
                HORIZON_MAX_PROCESSES: "3"
                DB_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                    key: mariadb-password
                REDIS_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: redis-password
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
            scheduler:
              enabled: true
              primary: false
              imageSelector: image
              args:
                - gosu
                - www-data
                - php
                - artisan
                - schedule:work
              envFrom:
                - configMapRef:
                    name: env
                - secretRef:
                    name: env
              env:
                DOCKER_SERVICE_NAME: cron
                ENTRYPOINT_SKIP_SCRIPTS: "01-permissions.sh 02-check-config.sh 11-first-time-setup.sh 12-migrations.sh"
                DB_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                    key: mariadb-password
                REDIS_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: redis-password
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
    persistence:
      # Uploaded media, OAuth keys and the entrypoint's state, on the TrueNAS dataset. Not on
      # Longhorn (no replica rebuilds for bulk media); back it up with ZFS snapshots on TrueNAS.
      storage:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: /mnt/main/apps/pixelfed
        mountPath: /var/www/storage
        targetSelectAll: true
      dotenv:
        enabled: true
        type: configmap
        objectName: dotenv
        mountPath: /var/www/.env
        subPath: .env
        readOnly: true
        targetSelectAll: true
      serviceworker:
        enabled: true
        type: configmap
        objectName: serviceworker
        mountPath: /var/www/public/sw.js
        subPath: sw.js
        readOnly: true
        targetSelectAll: true
      # Patched copies from configmap.phppatches above: Guzzle 8 rejects CURLOPT_PROTOCOLS, which broke
      # handle lookups and remote media. Drop once upstream ships the fix (pixelfed PR #7779 covers media)
      patch-fetchcache:
        enabled: true
        type: configmap
        objectName: phppatches
        mountPath: /var/www/app/Services/FetchCacheService.php
        subPath: FetchCacheService.php
        readOnly: true
        targetSelectAll: true
      patch-securemediafetch:
        enabled: true
        type: configmap
        objectName: phppatches
        mountPath: /var/www/app/Services/SecureMediaFetchService.php
        subPath: SecureMediaFetchService.php
        readOnly: true
        targetSelectAll: true
      patch-customemoji:
        enabled: true
        type: configmap
        objectName: phppatches
        mountPath: /var/www/app/Services/CustomEmojiService.php
        subPath: CustomEmojiService.php
        readOnly: true
        targetSelectAll: true
    mariadb:
      enabled: true
      mariadbUsername: pixelfed
      mariadbDatabase: pixelfed
      # The chart doesn't generate these: unset, they stay at its public PLACEHOLDER defaults.
      # MariaDB re-applies them on every start (--init-file), and Pixelfed reads DB_PASSWORD from
      # the same pixelfed-mariadbcreds Secret, so changing them later is safe. Letters and digits
      # only: they end up in SQL, shell and URL strings.
      password: ${PIXELFED_MARIADB_PWD}
      rootPassword: ${PIXELFED_MARIADB_ROOT_PWD}
      # The sub-chart doesn't see the parent's credentials, so it gets its own copy
      credentials:
        s3:
          type: s3
          url: "${S3URL}"
          bucket: "${S3PREFIX}-pixelfed"
          accessKey: "${S3ID}"
          secretKey: "${S3KEY}"
          encrKey: "${S3KEY}"
      persistence:
        data:
          # Metadata only (the media is on NFS); the chart default is 100Gi
          size: 10Gi
          volsync:
            - name: b2
              type: restic
              credentials: s3
              dest:
                enabled: true
              src:
                enabled: true
                trigger:
                  # Next free slot after WordPress's MariaDB at the end of the nightly chain (UTC)
                  schedule: 19 5 * * *
    redis:
      enabled: true
      # Same as MariaDB: unset, it stays at the chart's PLACEHOLDER default. Letters and digits only.
      password: ${PIXELFED_REDIS_PWD}
