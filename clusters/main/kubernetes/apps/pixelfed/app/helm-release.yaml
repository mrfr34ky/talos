---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pixelfed
  namespace: pixelfed
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 21.0.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Pixelfed (federated photo sharing) on the jippi/docker-pixelfed image. LAN-only for now
  # (internal); to go public, switch the ingress to external (Cloudflare Tunnel, traefik-external).
  # No Authentik: once public, the ActivityPub endpoints must stay open to other servers.
  # APP_DOMAIN is written into every federated post and handle, so the host can't change once the
  # instance has federated.
  # One pod runs the web server, the Horizon queue worker and the scheduler, so the media share
  # needs no RWX volume. Each container runs the image's entrypoint (caches, storage link); only
  # the web container runs the first-time setup and the database migrations.
  values:
    global:
      stopAll: false
      traefik:
        # The chart's default headers middleware answers CORS preflights itself, with no allowed
        # origin, which breaks browser-based Mastodon clients. Pixelfed handles CORS for its API.
        commonMiddlewares: []
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    image:
      repository: ghcr.io/jippi/docker-pixelfed
      pullPolicy: IfNotPresent
      tag: v0.15.0-apache-8.4-bookworm@sha256:0b1d1f6fd867ad626fc04e34b7e5b9d2d87e83cab6e2f9d6c168a74f1a03dd07
    # The entrypoint starts as root and drops to www-data (uid 33) through su/gosu; Apache binds
    # port 80 as root. The chart adds CHOWN/SETUID/SETGID/FOWNER/DAC_OVERRIDE and NET_BIND_SERVICE.
    securityContext:
      container:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        runAsUser: 0
        runAsGroup: 0
        capabilities:
          # Apache's root parent signals its www-data children; su writes an audit record
          add:
            - KILL
            - AUDIT_WRITE
    service:
      main:
        ports:
          main:
            port: 80
    # Pixelfed reads its settings from the environment; Laravel gives these precedence over .env
    configmap:
      env:
        enabled: true
        data:
          APP_NAME: Memories
          APP_ENV: production
          APP_DEBUG: "false"
          APP_URL: https://memories.${DOMAIN_1}
          APP_DOMAIN: memories.${DOMAIN_1}
          ADMIN_DOMAIN: memories.${DOMAIN_1}
          SESSION_DOMAIN: memories.${DOMAIN_1}
          # Pixelfed expects UTC internally; TZ (Europe/Brussels) still sets the container clock
          APP_TIMEZONE: UTC
          # Requests come through cloudflared and Traefik
          TRUST_PROXIES: "*"
          # Accounts are created by the admin only (php artisan user:create)
          OPEN_REGISTRATION: "false"
          ENFORCE_EMAIL_VERIFICATION: "true"
          # Instagram import without the default 1-day account age
          PF_IMPORT_IG_PERM_MIN_ACCOUNT_AGE: "0"
          # Largest file in KB (uploads and the Instagram import, videos included), under Cloudflare's
          # 100 MB request limit; the admin setting (Settings → Media) overrides it once saved
          MAX_PHOTO_SIZE: "95000"
          # PHP request limit; the import sends up to 10 files per request (Apache allows 1 GiB)
          POST_MAX_SIZE: "1000M"
          # Empty: no public contact e-mail on the landing page or in the instance API
          INSTANCE_CONTACT_EMAIL: ""
          # Mastodon-compatible API with personal access tokens (mobile apps, the Memories poster)
          OAUTH_ENABLED: "true"
          ACTIVITY_PUB: "true"
          AP_REMOTE_FOLLOW: "true"
          AP_INBOX: "true"
          AP_OUTBOX: "true"
          AP_SHAREDINBOX: "true"
          DB_CONNECTION: mysql
          DB_HOST: '{{ printf "%s-mariadb" .Release.Name }}'
          DB_PORT: "3306"
          DB_DATABASE: pixelfed
          DB_USERNAME: pixelfed
          # Renovate image updates otherwise leave new migrations pending
          DB_APPLY_NEW_MIGRATIONS_AUTOMATICALLY: "1"
          REDIS_CLIENT: phpredis
          REDIS_HOST: '{{ printf "%s-redis" .Release.Name }}'
          REDIS_PORT: "6379"
          CACHE_DRIVER: redis
          BROADCAST_DRIVER: redis
          QUEUE_DRIVER: redis
          SESSION_DRIVER: database
          MAIL_DRIVER: smtp
          MAIL_MAILER: smtp
          MAIL_HOST: smtp.gmail.com
          MAIL_PORT: "587"
          MAIL_ENCRYPTION: tls
          MAIL_USERNAME: ${GMAIL_USER}
          MAIL_FROM_ADDRESS: ${GMAIL_USER}
          MAIL_FROM_NAME: Memories
          LOG_CHANNEL: stderr
          LOG_LEVEL: info
          # PHP memory for image processing (the image's default is 128M)
          DOCKER_APP_PHP_MEMORY_LIMIT: 256M
      # The entrypoint scripts expect /var/www/.env to exist; the settings above make it unnecessary
      dotenv:
        enabled: true
        data:
          .env: |
            # Settings come from the environment (HelmRelease values), not from this file.
      # Pixelfed's sw.js, but form posts and /oauth/ go straight to the browser: the stock worker turns
      # the app login's redirect to pixelfed://oauth-callback into its "You are offline" page
      serviceworker:
        enabled: true
        data:
          sw.js: |
            const OFFLINE_VERSION = 2;
            const CACHE_NAME = "offline";
            const OFFLINE_URL = "/offline.html";

            self.addEventListener("install", (event) => {
            	event.waitUntil(
            		(async () => {
            			const cache = await caches.open(CACHE_NAME);
            			await cache.add(new Request(OFFLINE_URL, { cache: "reload" }));
            		})()
            	);
            	self.skipWaiting();
            });

            self.addEventListener("activate", (event) => {
            	event.waitUntil(
            		(async () => {
            			if ("navigationPreload" in self.registration) {
            				await self.registration.navigationPreload.enable();
            			}
            		})()
            	);
            	self.clients.claim();
            });

            self.addEventListener("fetch", (event) => {
            	const url = new URL(event.request.url);
            	if (event.request.mode !== "navigate" || event.request.method !== "GET" || url.pathname.startsWith("/oauth/")) {
            		return;
            	}
            	event.respondWith(
            		(async () => {
            			try {
            				const preloadResponse = await event.preloadResponse;
            				if (preloadResponse) {
            					return preloadResponse;
            				}
            				const networkResponse = await fetch(event.request);
            				return networkResponse;
            			} catch (error) {
            				const cache = await caches.open(CACHE_NAME);
            				const cachedResponse = await cache.match(OFFLINE_URL);
            				return cachedResponse;
            			}
            		})()
            	);
            });
    secret:
      env:
        enabled: true
        data:
          # Laravel encryption key (base64:...). Never change it: sessions, 2FA secrets and other
          # encrypted data in the database become unreadable.
          APP_KEY: ${PIXELFED_APP_KEY}
          MAIL_PASSWORD: ${PIXELFED_SMTP_PWD}
      vpn:
        enabled: true
        data:
          OPENVPN_USER: ${PRIVADO_USER}
          OPENVPN_PASSWORD: ${PRIVADO_PWD}
    workload:
      main:
        podSpec:
          containers:
            main:
              envFrom:
                - configMapRef:
                    name: env
                - secretRef:
                    name: env
              env:
                DOCKER_SERVICE_NAME: web
                # 01 chowns the read-only .env and the NFS share; 02 only lints .env
                ENTRYPOINT_SKIP_SCRIPTS: "01-permissions.sh 02-check-config.sh"
                DB_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                    key: mariadb-password
                REDIS_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: redis-password
              # Pixelfed's routes only answer on APP_DOMAIN, so the probes send that Host header
              probes:
                liveness:
                  enabled: true
                  type: http
                  path: /api/service/health-check
                  httpHeaders:
                    Host: memories.${DOMAIN_1}
                readiness:
                  enabled: true
                  type: http
                  path: /api/service/health-check
                  httpHeaders:
                    Host: memories.${DOMAIN_1}
                startup:
                  enabled: true
                  type: http
                  path: /api/service/health-check
                  httpHeaders:
                    Host: memories.${DOMAIN_1}
                  spec:
                    # The first start migrates the database and imports the city list
                    initialDelaySeconds: 10
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 90
                    successThreshold: 1
            # The worker and the scheduler skip the first-time setup and the migrations (web runs them)
            horizon:
              enabled: true
              primary: false
              imageSelector: image
              args:
                - gosu
                - www-data
                - php
                - artisan
                - horizon
              envFrom:
                - configMapRef:
                    name: env
                - secretRef:
                    name: env
              # Image jobs hold ImageMagick memory outside PHP's limit: fewer workers, more room (OOMs at 2.4Gi)
              resources:
                requests:
                  cpu: 10m
                  memory: 200Mi
                limits:
                  cpu: 1500m
                  memory: 4Gi
              env:
                DOCKER_SERVICE_NAME: worker
                ENTRYPOINT_SKIP_SCRIPTS: "01-permissions.sh 02-check-config.sh 11-first-time-setup.sh 12-migrations.sh"
                HORIZON_MAX_PROCESSES: "3"
                DB_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                    key: mariadb-password
                REDIS_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: redis-password
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
            scheduler:
              enabled: true
              primary: false
              imageSelector: image
              args:
                - gosu
                - www-data
                - php
                - artisan
                - schedule:work
              envFrom:
                - configMapRef:
                    name: env
                - secretRef:
                    name: env
              env:
                DOCKER_SERVICE_NAME: cron
                ENTRYPOINT_SKIP_SCRIPTS: "01-permissions.sh 02-check-config.sh 11-first-time-setup.sh 12-migrations.sh"
                DB_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                    key: mariadb-password
                REDIS_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: redis-password
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
    persistence:
      # Uploaded media, OAuth keys and the entrypoint's state, on the TrueNAS dataset. Not on
      # Longhorn (no replica rebuilds for bulk media); back it up with ZFS snapshots on TrueNAS.
      storage:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: /mnt/main/apps/pixelfed
        mountPath: /var/www/storage
        targetSelectAll: true
      dotenv:
        enabled: true
        type: configmap
        objectName: dotenv
        mountPath: /var/www/.env
        subPath: .env
        readOnly: true
        targetSelectAll: true
      serviceworker:
        enabled: true
        type: configmap
        objectName: serviceworker
        mountPath: /var/www/public/sw.js
        subPath: sw.js
        readOnly: true
        targetSelectAll: true
    mariadb:
      enabled: true
      mariadbUsername: pixelfed
      mariadbDatabase: pixelfed
      # The chart doesn't generate these: unset, they stay at its public PLACEHOLDER defaults.
      # MariaDB re-applies them on every start (--init-file), and Pixelfed reads DB_PASSWORD from
      # the same pixelfed-mariadbcreds Secret, so changing them later is safe. Letters and digits
      # only: they end up in SQL, shell and URL strings.
      password: ${PIXELFED_MARIADB_PWD}
      rootPassword: ${PIXELFED_MARIADB_ROOT_PWD}
      # The sub-chart doesn't see the parent's credentials, so it gets its own copy
      credentials:
        s3:
          type: s3
          url: "${S3URL}"
          bucket: "${S3PREFIX}-pixelfed"
          accessKey: "${S3ID}"
          secretKey: "${S3KEY}"
          encrKey: "${S3KEY}"
      persistence:
        data:
          # Metadata only (the media is on NFS); the chart default is 100Gi
          size: 10Gi
          volsync:
            - name: b2
              type: restic
              credentials: s3
              dest:
                enabled: true
              src:
                enabled: true
                trigger:
                  # Next free slot after WordPress's MariaDB at the end of the nightly chain (UTC)
                  schedule: 19 5 * * *
    redis:
      enabled: true
      # Same as MariaDB: unset, it stays at the chart's PLACEHOLDER default. Letters and digits only.
      password: ${PIXELFED_REDIS_PWD}
    # Outgoing traffic (federation deliveries, profile/media fetches, mail) leaves through VPN
    # instead of the home connection; the Cloudflare Tunnel only hides incoming traffic. One sidecar
    # covers all three containers (shared pod network). The firewall is the kill switch: with the
    # VPN down, nothing leaves except to the cluster and the LAN. The chart appends the pod and
    # service ranges to FIREWALL_OUTBOUND_SUBNETS and port 80 to FIREWALL_INPUT_PORTS (Traefik).
    addons:
      gluetun:
        enabled: true
        container:
          resources:
            # The add-on defaults to true, which drops everything but cpu/memory (the tun device)
            excludeExtra: false
            limits:
              truecharts.org/tun: 1
          # Restart gluetun after ~5 min of failed tunnel health checks (it self-heals before that);
          # no readiness probe, an unready sidecar would take the whole pod (and the website) out
          probes:
            liveness:
              enabled: true
              type: exec
              command:
                - /gluetun-entrypoint
                - healthcheck
              spec:
                initialDelaySeconds: 120
                periodSeconds: 60
                timeoutSeconds: 10
                failureThreshold: 5
            readiness:
              enabled: false
            startup:
              enabled: false
          envFrom:
            - secretRef:
                name: vpn
          env:
            VPN_SERVICE_PROVIDER: privado
            VPN_TYPE: openvpn
            SERVER_HOSTNAMES: bru-005.vpn.privado.io
            # gluetun's built-in IP for bru-005 is outdated
            OPENVPN_ENDPOINT_IP: 91.148.240.80
            FIREWALL: "on"
            # Kubelet probes and the LAN
            FIREWALL_OUTBOUND_SUBNETS: 192.168.1.0/24
            # Keep the cluster DNS so pixelfed-mariadb/-redis resolve. Lookups go through CoreDNS,
            # outside the tunnel, but don't reveal the home IP to the servers Pixelfed talks to.
            DNS_KEEP_NAMESERVER: "on"
    ingressMiddlewares:
      traefik:
        secure-headers:
          enabled: true
          type: headers
          data:
            stsSeconds: 63072000
            forceSTSHeader: true
            contentTypeNosniff: true
            customRequestHeaders:
              X-Forwarded-Proto: https
    ingress:
      main:
        enabled: true
        # Public through the Cloudflare tunnel (traefik-external + CrowdSec); LAN clients reach the same
        # ingress directly via Blocky's k8s_gateway
        ingressClassName: external
        integrations:
          traefik:
            enabled: true
            middlewares:
              - name: secure-headers
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
          nginx:
            enabled: false
        hosts:
          - host: memories.${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix
