      traefik:
        secure-headers:
          enabled: true
          type: headers
          data:
            stsSeconds: 63072000
            forceSTSHeader: true
            contentTypeNosniff: true
            customRequestHeaders:
              X-Forwarded-Proto: https
    ingress:
      main:
        enabled: true
        # Public through the Cloudflare tunnel (traefik-external + CrowdSec); LAN clients reach the same
        # ingress directly via Blocky's k8s_gateway
