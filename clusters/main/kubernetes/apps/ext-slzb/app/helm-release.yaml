---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ext-slzb
  namespace: ext-slzb
spec:
  interval: 15m
  chart:
    spec:
      chart: external-service
      version: 18.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    service:
      main:
        type: ExternalIP
        externalIP: 192.168.1.20
        integrations:
          traefik:
            enabled: true
            insecureSkipVerify: true
        ports:
          main:
            protocol: http
            port: 80
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          annotations:
            # Gatus: the SLZB web UI answers 401 (HTTP auth prompt) when it's up
            gatus.home-operations.com/endpoint: |
              conditions:
                - "[STATUS] == any(200, 401)"
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false  
          hosts:
            - host: slzb.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix          