---
# The dashboard's pods (front, Kong, API, auth, web, scraper) talk freely to each other; from outside
# only traefik-internal and Homarr reach the front: closes the direct path from other pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-dashboard-ingress
  namespace: kubernetes-dashboard
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homarr
      ports:
        - protocol: TCP
          port: 3000
---
# Out only to its own pods and DNS; the kube API is in kubernetes-dashboard-kube-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-dashboard-egress
  namespace: kubernetes-dashboard
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The kube API runs on the node, which ipBlock doesn't match
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubernetes-dashboard-kube-api
  namespace: kubernetes-dashboard
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
