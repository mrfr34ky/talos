---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 15m
  chart:
    spec:
      chart: home-assistant
      version: 32.0.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 50m
    credentials:
      s3:
        type: s3
        url: "${S3URL}"
        bucket: "${S3PREFIX}-home-assistant"
        accessKey: "${S3ID}"
        secretKey: "${S3KEY}"
        encrKey: "${S3KEY}" 
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 45 0 * * *
    homeassistant:
      trusted_proxies:
        - 172.16.0.0/16
        - 172.17.0.0/16          
    cnpg:
      main:
        password: ${HA_CNPG_PWD}
        cluster:
          singleNode: true
          # One Postgres pod instead of the chart's two: a replica on the same node adds
          # no availability, and the nightly backup to S3 covers the data.
          instances: 1
        #mode: recovery
        backups:
          enabled: true
          credentials: s3
          scheduledBackups:
            - name: daily-backup
              # Last in the nightly chain: takes 5-9 min (~7 GB DB), more than the usual 7-min gap
              schedule: "0 26 5 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          revision: "12"
          retentionPolicy: "7d"
        recovery:
          method: object_store
          credentials: s3
          revision: "11" 
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false   
          hosts:
            - host: ha.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix              
    addons:
      codeserver:
        enabled: true
        ingress:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
              # code-server runs with --auth none: Authentik is its only login
              middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false
          hosts:
            - host: ha.codeserver.${DOMAIN_0}