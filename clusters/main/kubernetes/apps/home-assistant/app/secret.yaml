---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: home-assistant-values
  namespace: home-assistant
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  S3URL: "${S3URL}"
  BUCKET: "${S3PREFIX}-home-assistant"
  S3ID: "${S3ID}"
  S3KEY: "${S3KEY}"
  HA_CNPG_PWD: "${HA_CNPG_PWD}"
