---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 15m
  chart:
    spec:
      chart: nextcloud
      version: 48.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 25m
    credentials:
      s3:
        type: s3
        url: "${S3URL}"
        bucket: "${S3PREFIX}-nextcloud-oldroots"
        accessKey: "${S3ID}"
        secretKey: "${S3KEY}"
        encrKey: "${S3KEY}" 
    nextcloud:
      credentials:
        initialAdminUser: ${NEXTCLOUD_USER}
        initialAdminPassword: ${NEXTCLOUD_PWD}
      general:
        default_phone_region: BE
        accessIP: ${NGINX_EXTERNAL_IP}
      #previews:
      #  max_memory: 5120
      #  max_file_size_image: 100
      collabora:
        enabled: true
        username: ${COLLABORA_USER}
        password: ${COLLABORA_PWD}
      php:
        memory_limit: 10G
        upload_limit: 20G
      opcache:
        memory_consumption: 2560
      logging:
        # ISO 8601 with UTC offset, the format CrowdSec's nextcloud parser expects.
        # The chart default (d/m/Y H:i:s) has no timezone and is ambiguous.
        log_date_format: "c"
    workload:
      main:
        podSpec:
          containers:
            # Streams nextcloud.log (on the NFS data volume) to stdout so CrowdSec can
            # read it. Reuses the Nextcloud image and runs as the same user.
            logtail:
              enabled: true
              primary: false
              imageSelector: image
              command:
                - tail
                - -n
                - "0"
                - -F
                - /var/www/html/data/logs/nextcloud.log
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi         
    persistence:
      html:    
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 48 1 * * *
      config:  
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 55 1 * * *
      data:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: /mnt/main/apps/nextcloud/nc_data
        mountPath: /var/www/html/data
        targetSelector:
          main:
            # Adds the mount to the logtail sidecar; the chart's own mounts are kept
            logtail:
              mountPath: /var/www/html/data
              readOnly: true                
    cnpg:
      main:
        password: ${NEXTCLOUD_CNPG_PWD}
        cluster:
          singleNode: true
        #mode: recovery
        backups:
          enabled: true
          credentials: s3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 2 2 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          revision: "4"
          retentionPolicy: "7d"
        recovery:
          method: object_store
          credentials: s3
          revision: "3"  
    redis:
      password: ${NEXTCLOUD_REDIS_PWD}
    ingress:
        main:
          enabled: true
          ingressClassName: external
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false   
          hosts:
            - host: next.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix   