---
# Posts every closed PR (merged or not) to Discord. Webhook URL: Actions secret DISCORD_PR_WEBHOOK.
# PRs merged by the Automerge workflow don't trigger this (GITHUB_TOKEN); Automerge posts those itself.
name: PR closed to Discord

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script from the default branch, never the PR's own copy (it runs with the webhook secret)
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Send to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          MERGED: ${{ github.event.pull_request.merged }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: bash .github/scripts/discord-pr-closed.sh
