---
# Squash-merges Renovate PRs labelled "automerge" (see .github/special_talos.json5) as soon as
# "HelmRelease Test" has passed for them. Every finished test run handles only its own PR, so several
# PRs can merge at once instead of the ~2 per run Renovate manages on its own.
# Only the exact commit that was tested is merged (--match-head-commit): if the PR got a new commit in
# the meantime, GitHub refuses the merge and the new commit waits for its own test run.
name: Automerge

on:
  workflow_run:
    workflows: ["HelmRelease Test"]
    types:
      - completed

concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  automerge:
    # Only after a successful test run of a pull request; a failed test leaves the PR for review
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Empty for PRs from forks, which are never auto-merged
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "$PR_NUMBER" ]; then
            echo "ℹ️ No pull request of this repository for the tested commit, nothing to merge"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            pr=$(gh pr view "$PR_NUMBER" --json state,isDraft,headRefOid,labels)
            state=$(jq -r '.state' <<<"$pr")
            head=$(jq -r '.headRefOid' <<<"$pr")
            labels=$(jq -r '.labels[].name' <<<"$pr")

            if [ "$state" != "OPEN" ]; then
              echo "ℹ️ PR #$PR_NUMBER is $state, nothing to merge"
              exit 0
            fi
            if [ "$(jq -r '.isDraft' <<<"$pr")" = "true" ]; then
              echo "ℹ️ PR #$PR_NUMBER is a draft, leaving it alone"
              exit 0
            fi
            if ! grep -qx 'automerge' <<<"$labels"; then
              echo "ℹ️ PR #$PR_NUMBER is not labelled automerge, it needs a manual merge"
              exit 0
            fi
            # Talos/Kubernetes upgrades are never auto-merged, even if mislabelled
            if grep -qx 'system-upgrade' <<<"$labels"; then
              echo "🛑 PR #$PR_NUMBER is labelled system-upgrade, it needs a manual merge"
              exit 0
            fi
            if [ "$head" != "$TESTED_SHA" ]; then
              echo "ℹ️ PR #$PR_NUMBER moved on from the tested commit $TESTED_SHA to $head, its own test run decides"
              exit 0
            fi

            if gh pr merge "$PR_NUMBER" --squash --match-head-commit "$TESTED_SHA"; then
              echo "✅ Merged PR #$PR_NUMBER at $TESTED_SHA"
              exit 0
            fi

            # Typically "Base branch was modified" when another PR merged at the same moment
            echo "⚠️ Merge attempt $attempt failed, retrying in 30s"
            sleep 30
          done

          echo "❌ Could not merge PR #$PR_NUMBER, Renovate retries on its next run"
          exit 1
